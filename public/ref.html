<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IT Helpdesk – Referred issues</title>
<link rel="stylesheet" href="/styles.css">
<script src="/common.js" defer></script>
<script src="/ref.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <h1>IT Helpdesk – Referred issues</h1>
  <button id="theme" class="link" type="button" aria-label="Switch light or dark mode">Theme</button>
</header>
<main id="main">
  <form id="confirm" class="card" novalidate>
    <h2>Confirm who you are</h2>
    <p class="muted">This personal link was emailed to you by the IT Helpdesk. Enter your department and surname to open it.</p>
    <label for="department">Department</label>
    <input id="department" type="text" autocomplete="organization" maxlength="20" placeholder="e.g. SOH" required>
    <label for="surname">Surname</label>
    <input id="surname" type="text" autocomplete="family-name" maxlength="40" required>
    <p class="error" id="confirm-err" aria-live="polite"></p>
    <div class="actions end"><button type="submit">Open</button></div>
  </form>

  <section id="list" class="hidden" aria-live="polite">
    <div class="card">
      <h2 id="who" tabindex="-1"></h2>
      <p class="muted" id="expiry"></p>
    </div>
    <div id="items"></div>
  </section>
</main>
</body>
</html>
